<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>Reading…</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="reader-root" id="readerRoot">
    <div class="reader-topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="/" class="btn btn-icon" title="Back to library">←</a>
        <div class="reader-title" id="readerTitle">Loading…</div>
      </div>

      <div class="page-jump" id="pageJump">
        <span class="page-jump-label">Page</span>
        <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" aria-label="Page number" />
        <span id="pageTotal" class="page-jump-total">/ –</span>
        <button class="btn btn-ghost btn-sm" id="pageGo" title="Jump to this page">Go</button>
        <span id="jumpStatus" class="page-jump-status"></span>
      </div>

      <div class="toolbar">
        <button class="btn btn-icon" id="toolHighlight" data-tool="highlight" title="Highlight: drag over text to highlight it">🖍</button>
        <button class="btn btn-icon" id="toolDraw" data-tool="draw" title="Draw: drag anywhere on the page">🖊</button>
        <span id="colorSwatches" style="display:flex; gap:6px; align-items:center; margin:0 4px;"></span>
        <button class="btn btn-icon" id="toolErase" data-tool="erase" title="Eraser: drag over a highlight or drawing to remove it">⌫</button>
        <button class="btn btn-icon" id="toolAi" data-tool="ai" title="Ask AI: drag over text to ask about it">🤖</button>
        <button class="btn btn-icon" id="toolNote" data-tool="note" title="Save word/quote: drag over text to save it">📝</button>
        <button class="btn btn-icon" id="toolFullscreen" title="Fullscreen">⛶</button>
        <button class="btn btn-primary" id="endReading" title="Save where you stopped and go back to the library">End reading</button>
      </div>
    </div>

    <div class="mode-hint" id="modeHint" style="display:none;"></div>

    <div class="reader-body" id="readerBody">
      <div class="reader-loading" id="readerLoading">Opening book…</div>
    </div>
  </div>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-panel-header">
      <h3>Ask about this</h3>
      <button class="btn btn-icon" id="closeAiPanel">✕</button>
    </div>
    <div class="ai-panel-body">
      <div class="ai-source-text" id="aiSourceText"></div>
      <div id="aiAnswerArea"></div>
    </div>
    <div class="ai-panel-footer">
      <input type="text" id="aiFollowupInput" placeholder="Ask a follow-up…" />
      <button class="btn btn-primary" id="aiFollowupBtn">Ask</button>
    </div>
  </div>

  <!-- Save word / phrase / quote -->
  <div class="modal-overlay" id="noteOverlay" style="display:none;">
    <div class="modal">
      <h2>Save to your notes</h2>
      <p class="hint">Paste or type text. It goes to the Words or Quotes page on your home screen, where you can add explanations later.</p>
      <div class="seg" id="noteKind">
        <button type="button" class="seg-btn active" data-kind="word">📝 Word / phrase</button>
        <button type="button" class="seg-btn" data-kind="quote">❝ Quote</button>
      </div>
      <div class="field"><label>Text</label><textarea id="noteText" rows="3" placeholder="Paste or type here…"></textarea></div>
      <div class="field"><label>Explanation (optional)</label><textarea id="noteExplanation" rows="2" placeholder="What does it mean? Why does it matter?"></textarea></div>
      <div class="field" id="noteAuthorField" style="display:none;"><label>Author (optional)</label><input type="text" id="noteAuthor" /></div>
      <div class="field"><label>Page</label><input type="number" id="notePage" min="0" /></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="noteCancel">Cancel</button>
        <button class="btn btn-primary" id="noteSave">Save</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/vendor/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';
  </script>
  <script src="/js/reader.js"></script>
  <script src="/js/reader-notes.js"></script>
</body>
</html>
